# .github/workflows/tick.yml
name: tick
on:
  # Ticks are driven solely by an external cron-job.org job, which POSTs a
  # workflow_dispatch on the :05/:35 slots, 13:00-21:59 UTC weekdays (see
  # docs/cron-job-backup.md); run.py gates market hours precisely. GitHub's
  # own `schedule` cron is intentionally not used here, mirroring the
  # 52wk-poster repo: it delivers only a fraction of slots and can fire up to
  # 45 min late, and in live mode a late fire lands in a different half-hour
  # window than the dispatch, posting an extra ticker and exhausting the
  # daily cap early.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tick
        env:
          PYTHONUNBUFFERED: "1"
        # PHASE 1 — PREVIEW: dry-run, no secrets. Writes would-be posts to
        # output/YYYY-MM-DD/. Phase 2 (live) adds STOCKTWITS_ACCESS_TOKEN
        # (the NEW dedicated relative-weakness account — never the RS or
        # 52wk accounts) plus MAX_PER_TICK=1 / MAX_PER_DAY=12 ramp env vars,
        # and flips this line to: python run.py --sync-state --live
        run: python run.py
      - name: Commit state + output
        # main only: the rebase/push flow assumes the cron branch; a manual
        # dispatch on a feature branch (e.g. testing a PR) must never push.
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "rw-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state output
          if git diff --cached --quiet; then
            echo "nothing to record this tick"; exit 0
          fi
          git commit -m "tick: $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase origin main
          git push
